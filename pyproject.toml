[project]
name = "genai-systems-lab"
version = "1.2.0"
requires-python = ">=3.13,<3.14"
dependencies = [
	"fastapi==0.141.1",
	"starlette==1.6.0",
	"google-genai==1.69.0",
	"langgraph==1.2.11",
	"python-dotenv==1.2.3",
	"pydantic==2.13.4",
	"duckdb==1.5.5",
	"sqlalchemy==2.0.52",
	"pandas==3.0.5",
	"rich==14.3.3",
	"numpy==2.5.2",
	"httpx==0.28.1",
	"langfuse>=2.0.0",
	"PyJWT==2.13.0",
	"cryptography==50.0.1",
	"redis==8.1.0",
	"rq==2.11.0",
]

# Optional extras — keep the default install slim.  Browser automation pulls
# in the ~400 MB Playwright driver + Chromium; it is only needed by the
# ``genai-browser-agent`` project.
[project.optional-dependencies]
browser = [
	"playwright==1.62.0",
]
crew = [
	"crewai==1.15.17",
]
production = [
	"alembic==1.19.1",
	"psycopg[binary]==3.3.4",
]

[dependency-groups]
dev = [
	"pytest==9.1.1",
	"ruff==0.16.4",
]

[project.scripts]
app = "shared.api.app:app"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = [
	"E",      # pycodestyle errors
	"F",      # pyflakes
	"I",      # isort
	"B",      # flake8-bugbear
	"UP",     # pyupgrade
	"SIM",    # flake8-simplify
	"S",      # flake8-bandit (security)
	"RUF",    # ruff-specific
]
ignore = [
	"E501",   # line length is handled by the formatter
	"S101",   # asserts are OK in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S"]
"benchmarks/**/*.py" = ["S"]

[tool.bandit]
exclude_dirs = ["tests", "benchmarks", "portfolio", "langgraph-data-analyst"]
skips = ["B101"]
